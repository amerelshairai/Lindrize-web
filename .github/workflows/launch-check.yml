# The last gate before the domain move (docs/LAUNCH-CHECKLIST.md).
# Started by hand: Actions > Launch check > Run workflow.
# It fails while anything a visitor would see is unfinished, and says what.
name: Launch check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Is the site ready to go live?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Launch rules
        run: node scripts/check-content.mjs --launch
