# Once a month, propose updates in one grouped pull request per area.
# New releases are ignored for their first 14 days, matching the project's rule of only
# installing versions that have been public for at least two weeks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      site-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
