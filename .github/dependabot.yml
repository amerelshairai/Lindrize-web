# Once a month, propose updates in one grouped pull request per area.
# New releases are ignored for their first 14 days, matching the project's rule of only
# installing versions that have been public for at least two weeks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      site-dependencies:
        patterns: ['*']
    ignore:
      # The type checker (@astrojs/check) does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Playwright must move together with the "overrides" entry in package.json, by hand.
      - dependency-name: '@playwright/test'
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /receiver
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
