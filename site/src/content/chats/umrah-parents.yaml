id: umrah-parents
order: 2
lang: ar
package: MKK-03
title: { en: "Umrah for elderly parents", ar: "عمرة لوالدين كبيرين في السن" }
messages:
  - { from: customer, time: "2:15 PM", text: "أبوي وأمي كبار بالعمر، بدنا فندق قريب من الحرم" }
  - { from: assistant, time: "2:15 PM", text: "الله يحفظهم! بنصحكم ببكج «عمرة بالطيران - 7 ليالي»: طيران بدل الباص عشان ما يتعبوا، وفندق 4 نجوم. السعر 595 دينار للشخص وشامل فيزا العمرة، ومع كل معتمر طقم عمرة وعبوة زمزم 5 لتر هدية." }
  - { from: customer, time: "2:16 PM", text: "والفندق قديش ببعد عن الحرم؟" }
  - { from: assistant, time: "2:16 PM", text: "هاي المعلومة بأكدها إلكم عمر، مسؤول العمرة عنا. بتحبوا أبعتله طلبكم؟" }
