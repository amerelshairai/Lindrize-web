group: price
order: 6
question:
  en: "What does the monthly fee cover?"
  ar: "ماذا تشمل الرسوم الشهرية؟"
answer:
  en: "There are two monthly plans: one for the service alone, and one that also includes the AI usage, managed for you. We explain which one suits you on the call."
  ar: "هناك خطتان شهريتان: واحدة للخدمة فقط، وأخرى تشمل أيضاً استخدام الذكاء الاصطناعي ونديره نحن عنك. نوضّح لك الأنسب في المكالمة."
