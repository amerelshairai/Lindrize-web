  ar: "مصمَّمة للسفر، ومكيَّفة للمجالات القريبة منه."
lead:
  en: "Our work starts with travel agencies and tour operators. The same systems are adapted for the fields below, around how each one works."
  ar: "عملنا يبدأ بمكاتب السفر ومنظّمي الرحلات. والأنظمة نفسها تُكيَّف للمجالات التالية وفق طريقة عمل كل مجال."
