groupLabel: { en: "What you need", ar: "ما تحتاجه" }
industryLabel: { en: "Your field", ar: "مجال عملك" }
all: { en: "All", ar: "الكل" }
allIndustries: { en: "All fields", ar: "كل المجالات" }
