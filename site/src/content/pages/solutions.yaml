seo:
  title:
    en: "30 systems for travel agencies | Lindrize"
    ar: "30 نظاماً لمكاتب السفر والسياحة | Lindrize"
  description:
    en: "Systems that answer your customers, look after travellers and run your office: quote follow-up, Umrah group lists, payment reminders and more. Search or filter."
    ar: "أنظمة تردّ على عملائك وتعتني بالمسافرين وتدير مكتبك: متابعة عروض الأسعار، قوائم مجموعات العمرة، تذكير الدفعات وغيرها. ابحث أو استخدم عوامل التصفية."
title:
  en: "30 systems for travel agencies"
  ar: "30 نظاماً لمكاتب السفر والسياحة"
lead:
  en: "Start with one system and add more when you're ready. Search by name, or filter by what you need."
  ar: "ابدأ بنظام واحد، وأضف غيره متى شئت. ابحث بالاسم، أو استخدم عوامل التصفية حسب ما تحتاجه."
searchLabel: { en: "Search systems", ar: "ابحث في الأنظمة" }
