# The website's four containers. Started with server/services.sh (see docs/SERVER-SETUP.md).
# They run next to n8n and never touch it.
#
# - Hostinger's Traefik (already on the server for n8n) receives every visit on ports 80 and 443,
#   handles HTTPS, and passes the Lindrize addresses to "web". Nothing here publishes a port.
# - Secrets come from two files that exist only on the server and are never on GitHub:
#     /srv/lindrize/.env            (Umami, its database, and the launch switch)
#     /srv/lindrize/.env.receiver   (the email receiver)
# - Before launch only the test address (new.) and stats. are routed. On launch day
#   LINDRIZE_STAGE=live adds docker-compose.live.yml: the main address, and the test address
#   then forwards to it.
name: lindrize

services:
  web:
    # Nginx that runs as an ordinary user, not root. Exact version.
    image: nginxinc/nginx-unprivileged:1.28-alpine
    volumes:
      - /var/www/lindrize:/var/www/lindrize:ro
      - /var/log/lindrize:/var/log/lindrize
      - ./repo/server/nginx/lindrize.conf:/etc/nginx/conf.d/default.conf:ro
      - ./repo/server/nginx/site.conf:/etc/nginx/lindrize/site.conf:ro
      - ./repo/server/nginx/headers.conf:/etc/nginx/lindrize/headers.conf:ro
      - ./repo/server/nginx/preview-before-launch.conf:/etc/nginx/lindrize/preview.conf:ro
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    networks: [edge, backend]
    depends_on: [receiver, umami]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    labels:
      traefik.enable: "true"
      traefik.docker.network: lindrize_edge
      traefik.http.services.lindrize.loadbalancer.server.port: "8080"
      traefik.http.routers.lindrize-preview.rule: Host(`new.lindrize.online`) || Host(`stats.lindrize.online`)
      traefik.http.routers.lindrize-preview.entrypoints: websecure
      traefik.http.routers.lindrize-preview.tls.certresolver: letsencrypt
    logging: &logging
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  receiver:
    build: ./repo/receiver
    env_file: ./.env.receiver
    environment:
      PORT: "8080"
      # The published site's own list of choices, so content edits never need a rebuild.
      CATALOG_PATH: /site/current/design-catalog.json
    volumes:
      - /var/www/lindrize:/site:ro
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging

  umami:
    # Exact version. Updates are a deliberate change to this line, tested first.
    image: ghcr.io/umami-software/umami:3.4.1
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in /srv/lindrize/.env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in /srv/lindrize/.env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:?set UMAMI_TWO_FACTOR_KEY in /srv/lindrize/.env}
      # Trust only the visitor address that our Nginx passes on.
      CLIENT_IP_HEADER: x-real-ip
      # Umami itself sends nothing to anyone.
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, database]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  db:
    # Umami's own database, separate from n8n's.
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in /srv/lindrize/.env}
    volumes:
      - umami-db:/var/lib/postgresql/data
    # A closed network: only Umami can reach the database.
    networks: [database]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

networks:
  # Traefik reaches "web" here.
  edge:
    name: lindrize_edge
  # web, receiver and Umami talk here. The receiver needs the internet to send email.
  backend: {}
  database:
    internal: true

volumes:
  umami-db:
