# Copy to /etc/nginx/conf.d/lindrize-zones.conf
# Request limits per visitor address. They are applied in the site files.
limit_req_zone $binary_remote_addr zone=lz_design:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lz_count:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lz_login:10m rate=10r/m;
limit_req_status 429;

# The test address (and anything that is not the real site) is hidden from search engines.
map $host $lz_robots {
    default              "noindex, nofollow";
    lindrize.online      "";
    www.lindrize.online  "";
}

# Access log without full visitor addresses: the last part is removed
# (1.2.3.4 -> 1.2.3.0; IPv6 keeps only its first three groups). Ubuntu deletes these logs after
# 14 days. The Privacy Policy describes exactly this, so change both together.
map $remote_addr $lz_short_ip {
    ~^(?<a>\d+\.\d+\.\d+)\.\d+$           $a.0;
    ~^(?<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $b::;
    default                               0.0.0.0;
}
log_format lz_short '$lz_short_ip [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $host';
