# Copy to /etc/nginx/sites-available/lindrize-preview.conf
# The test address used before the domain move. Search engines are told not to list it.
# After launch it is replaced by lindrize-preview-after-launch.conf.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name new.lindrize.online;

    ssl_certificate     /etc/letsencrypt/live/new.lindrize.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.lindrize.online/privkey.pem;
    include snippets/lindrize-tls.conf;

    include snippets/lindrize-site.conf;
}
