# The website's own web server (Nginx), running in a container behind Hostinger's Traefik.
# Traefik receives every visit on ports 80 and 443, handles HTTPS, and passes visits for the
# Lindrize addresses to this container on port 8080. Mounted as /etc/nginx/conf.d/default.conf.

server_tokens off;
charset utf-8;
client_max_body_size 16k;

# The visitor's real address comes from Traefik in X-Forwarded-For. Only addresses inside the
# server's own private networks (where Traefik connects from) are trusted to say so.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Docker's own name lookup, so "receiver" and "umami" are found even if they start later.
resolver 127.0.0.11 valid=30s ipv6=off;

# Request limits per visitor address.
limit_req_zone $binary_remote_addr zone=lz_design:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lz_count:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lz_login:10m rate=10r/m;
limit_req_status 429;

# Everything except the main address is hidden from search engines.
map $host $lz_robots {
    default              "noindex, nofollow";
    lindrize.online      "";
    www.lindrize.online  "";
}

# Logs keep shortened visitor addresses only (1.2.3.4 -> 1.2.3.0). server/rotate-logs.sh deletes
# them after 14 days. The Privacy Policy describes exactly this, so change both together.
map $remote_addr $lz_short_ip {
    ~^(?<a>\d+\.\d+\.\d+)\.\d+$                       $a.0;
    ~^(?<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):   $b::;
    default                                           0.0.0.0;
}
log_format lz_short '$lz_short_ip [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $host';
access_log /var/log/lindrize/access.log lz_short;
error_log /var/log/lindrize/error.log warn;

# Any other address: close the connection.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

# The website.
server {
    listen 8080;
    server_name lindrize.online;
    include /etc/nginx/lindrize/site.conf;
}

# www.lindrize.online -> lindrize.online
server {
    listen 8080;
    server_name www.lindrize.online;
    include /etc/nginx/lindrize/headers.conf;
    return 301 https://lindrize.online$request_uri;
}

# The test address: shows the site before launch, forwards to the main address after it.
include /etc/nginx/lindrize/preview.conf;

# The private Umami dashboard.
server {
    listen 8080;
    server_name stats.lindrize.online;
    client_max_body_size 256k;
    set $lz_umami http://umami:3000;

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass $lz_umami;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Slow down password guessing.
    location = /api/auth/login {
        limit_req zone=lz_login burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass $lz_umami;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
