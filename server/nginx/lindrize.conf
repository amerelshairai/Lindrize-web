# Copy to /etc/nginx/sites-available/lindrize.conf
# Enabled on launch day, after the certificate for these two names exists (docs/DNS-MOVE.md).
# The main address is lindrize.online. www.lindrize.online forwards to it.

# www.lindrize.online -> lindrize.online
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lindrize.online;

    ssl_certificate     /etc/letsencrypt/live/lindrize.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindrize.online/privkey.pem;
    include snippets/lindrize-tls.conf;
    include snippets/lindrize-headers.conf;

    return 301 https://lindrize.online$request_uri;
}

# The website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lindrize.online;

    ssl_certificate     /etc/letsencrypt/live/lindrize.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lindrize.online/privkey.pem;
    include snippets/lindrize-tls.conf;

    include snippets/lindrize-site.conf;
}
