# Copy to /etc/nginx/snippets/lindrize-site.conf
# Everything the website answers. Used by the real address and by the test address.

root /var/www/lindrize/current;
index index.html;
charset utf-8;
port_in_redirect off;
absolute_redirect off;
client_max_body_size 16k;
# Follow the "current" link to the newest release on every request.
disable_symlinks off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

# Pages: the browser asks each time whether its copy is still current, so a publish shows at once.
location / {
    include snippets/lindrize-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

# Files whose names change whenever their content changes (scripts and fonts): keep for a year.
location /_astro/ {
    include snippets/lindrize-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Icons and the share image.
location ~* ^/[^/]+\.(?:png|svg|ico|webmanifest)$ {
    include snippets/lindrize-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

# Not-found pages, in the visitor's language.
error_page 404 /404.html;
location /ar/ {
    include snippets/lindrize-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /ar/404/index.html;
    try_files $uri $uri/ =404;
}

# Short booking link for emails and profiles.
location = /book  { return 302 https://calendly.com/amerelshair-ai-lindrize/15-minute-call-with-lindrize; }
location = /book/ { return 302 https://calendly.com/amerelshair-ai-lindrize/15-minute-call-with-lindrize; }

# "Email me my design" goes to the receiver, which listens only inside the server.
location = /api/design {
    limit_except POST { deny all; }
    limit_req zone=lz_design burst=5 nodelay;
    include snippets/lindrize-headers.conf;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
location /api/ { return 404; }

# Visitor counting (Umami), served from the site's own address so no outside request is made.
location = /u/script.js {
    include snippets/lindrize-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    proxy_pass http://127.0.0.1:8082/script.js;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
}
location = /u/api/send {
    limit_except POST { deny all; }
    limit_req zone=lz_count burst=40 nodelay;
    proxy_pass http://127.0.0.1:8082/api/send;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location /u/ { return 404; }

# Hidden files are never served (the certificate check folder is handled on port 80).
location ~ /\. { return 404; }
