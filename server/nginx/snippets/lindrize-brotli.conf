# Optional. Copy to /etc/nginx/snippets/lindrize-brotli.conf only after installing
#   libnginx-mod-http-brotli-filter
# and add "include snippets/lindrize-brotli.conf;" at the end of lindrize-site.conf.
# Brotli makes pages about 15% smaller than gzip. The site passes its speed targets without it.
brotli on;
brotli_comp_level 5;
brotli_min_length 512;
brotli_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;
