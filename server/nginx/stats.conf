# Copy to /etc/nginx/sites-available/lindrize-stats.conf
# The private Umami dashboard. It asks for a login; search engines are told not to list it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.lindrize.online;

    ssl_certificate     /etc/letsencrypt/live/new.lindrize.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.lindrize.online/privkey.pem;
    include snippets/lindrize-tls.conf;
    client_max_body_size 256k;
    access_log /var/log/nginx/lindrize-stats.access.log lz_short;

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # Slow down password guessing.
    location = /api/auth/login {
        limit_req zone=lz_login burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
