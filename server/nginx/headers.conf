# Security headers. Nginx drops inherited headers as soon as a block adds its own,
# so every block that adds a header includes this file again.
#
# The rules for scripts and styles travel inside each page (a hash for every script), written
# by the site builder. The header below adds the one rule a page cannot set for itself:
# nobody may show this site inside a frame.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Empty on the main address, so nothing is sent there. See lindrize.conf.
add_header X-Robots-Tag $lz_robots always;
