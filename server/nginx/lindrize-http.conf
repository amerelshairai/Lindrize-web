# Copy to /etc/nginx/sites-available/lindrize-http.conf and enable it first.
# Port 80 for every Lindrize address: answers the certificate check, sends everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name lindrize.online www.lindrize.online new.lindrize.online stats.lindrize.online;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
