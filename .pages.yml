        label: City
        type: object
        fields:
          - name: en
            label: English
            type: string
          - name: ar
            label: Arabic
            type: string
      - name: founder
        label: Founder
        type: string
      - name: demo
        label: Demo
        type: object
        fields:
          - name: handle
            label: Handle
            type: string
          - name: chatUrl
            label: Chat url
            type: string
          - name: profileUrl
            label: Profile url
            type: string
      - name: videoId
        label: Video id
        description: The part of the YouTube link after "v=". Leave empty to hide the video.
        type: string
      - name: turnstileSiteKey
        label: Turnstile site key
        description: The public "site key" from Cloudflare Turnstile. Leave empty to hide the email form.
        type: string
      - name: umamiWebsiteId
        label: Umami website id
        description: The "Website ID" from Umami. Leave empty to switch counting off.
        type: string
      - name: foundingPlaces
        label: Founding places
        type: object
        fields:
          - name: tier30
            label: Tier30
            type: number
          - name: tier20
            label: Tier20
            type: number
          - name: tier15
            label: Tier15
            type: number
