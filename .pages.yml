    label: Settings (links, keys, places left)
    type: file
    path: site/src/data/settings.json
    format: json
    fields:
      - name: siteName
        label: Site name
        type: string
      - name: siteUrl
        label: Site url
        type: string
      - name: calendlyUrl
        label: Calendly url
        type: string
      - name: whatsappNumber
        label: Whatsapp number
        type: string
